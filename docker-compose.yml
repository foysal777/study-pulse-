version: '3.8'

services:
  db:
    image: postgres:15
    container_name: study_pulse_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5438:5432"

  web:
    build: .
    container_name: study_pulse_web
    restart: always
    command: bash -c "python manage.py collectstatic --noinput && python manage.py migrate && gunicorn project_root.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    env_file:
      - ./project_root/.env
    environment:
      - DB_HOST=db
    depends_on:
      - db

volumes:
  postgres_data:
  static_volume:
  media_volume:
